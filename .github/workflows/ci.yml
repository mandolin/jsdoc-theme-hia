# 中文：四个真实平台/运行组合执行相同发行门禁；不发布npm。
# English: Four actual platform/runtime combinations run the same release gate without npm publication.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: jsdoc-theme-hia

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.23.4
          - 24.22.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

        with:
          path: jsdoc-theme-hia

      - name: Check out pinned plugin owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-plugin-hia-sys
          ref: 15970dc9da0f8e120677eab7eba3e959dcf42a34
          path: jsdoc-plugin-hia-sys

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Prepare pinned owner archives
        run: npm run prepare:owners

      - name: Install frozen dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Run release gate
        run: npm run release:gate
